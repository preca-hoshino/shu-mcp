name: Release on Master Push

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: windows-latest
    permissions:
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            target: x86_64-pc-windows-msvc
            arch: x64
            artifact_name: shu-mcp-x64.exe
          - name: arm64
            target: aarch64-pc-windows-msvc
            arch: x64_arm64
            artifact_name: shu-mcp-arm64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary (${{ matrix.name }})
        env:
          RUSTFLAGS: "-C link-arg=/OPT:REF,ICF"
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare Binaries for Attestation & Upload
        shell: bash
        run: |
          mkdir -p staging
          TARGET_DIR="target/${{ matrix.target }}/release"
          # 复制为带架构标识的二进制
          cp "${TARGET_DIR}/shu-mcp.exe" "staging/${{ matrix.artifact_name }}"
          # 如果是 x64，额外保留一份无后缀的默认文件名，方便直接使用
          if [ "${{ matrix.arch }}" = "x64" ]; then
            cp "${TARGET_DIR}/shu-mcp.exe" "staging/shu-mcp.exe"
          fi

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: staging/*.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: staging/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Generate Version Tag
        shell: bash
        run: |
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-6)
          RELEASE_TAG="v${CARGO_VERSION}-b${{ github.run_number }}-${SHORT_SHA}"

          echo "CARGO_VERSION=${CARGO_VERSION}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Publish New Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cat << EOF > release_notes.md
          ### 下载说明
          - **x64 架构（常规 PC）**：推荐直接下载 \`shu-mcp.exe\`（或 \`shu-mcp-x64.exe\`）
          - **ARM64 架构（骁龙 X Elite / Surface 等）**：请下载 \`shu-mcp-arm64.exe\`

          **更新日志**：
          > ${COMMIT_MSG}

          **验证构建来源 (GitHub Attestations)**：
          \`\`\`bash
          gh attestation verify shu-mcp.exe --repo ${{ github.repository }}
          \`\`\`
          EOF

          # 使用 GitHub CLI 发布 Release 并上传全部架构二进制文件
          gh release create "${RELEASE_TAG}" \
            dist/shu-mcp.exe \
            dist/shu-mcp-x64.exe \
            dist/shu-mcp-arm64.exe \
            --title "${RELEASE_TAG}" \
            --notes-file release_notes.md

      - name: Delete Older Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在清理旧的 Release 和 Git Tag，仅保留最新版本..."
          # 列出所有非当前 RELEASE_TAG 的 Release 并执行删除（同时删除对应的 git tag）
          gh release list --limit 100 --json tagName --jq ".[].tagName | select(. != \"${RELEASE_TAG}\")" | while read -r old_tag; do
            if [ -n "$old_tag" ]; then
              echo "Deleting old release and tag: $old_tag"
              gh release delete "$old_tag" --yes --cleanup-tag || true
            fi
          done
